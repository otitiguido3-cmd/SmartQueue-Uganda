<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Services</title>
    <link rel="stylesheet" href="../CSS/home.css">
    <link rel="stylesheet" href="../CSS/bank_services.css">
</head>
<body>
    <header class="header">
        
        <div class="logo-text">
            <!-- <img src="../images/app-images/back.png" alt="Back"> -->
            <h2>Bank Services</h2>
        </div>
        

    </header>

    <section class="bank_name">
        <div class="bank_details">
            <img src="../images/app-images/banks.png" alt="Bank logo">
            <div>
                <h2>Bank Name</h2>
                <p>Location eg. Gulu</p>
            </div>
            
        </div>
        
    </section>
    <section class="bank_info">
        <form action="#" method="get">
            <div>
                <p>Estimated Waiting time</p>
                <label for="waiting time" name = "waiting_time">15 minutes per customer</label> 
            </div>
            <div class="queue_info">
                <div>
                    <p>Number of customers in queue</p>
                    <label for="customers_in_queue" name = "customers_in_queue">10</label>
                </div>
                <div>
                    <p>Currently Serving</p>
                    <label for="currently_serving" name = "currently_serving">A008</label>

                </div>
            </div>
            <div class="available_services">
                <label for="Available Services">
                    Available Services
                </label>
                <a href="">
                    <button type="button" class="service_offered" name="service_offered">General Banking</button>
                </a>
                <a href="">
                    <button type="button" class="service_offered" name="service_offered">Account opening</button>
                </a>
                <a href="">
                    <button type="button" class="service_offered" name="service_offered">Customer Services</button>
                </a>
                
                
                
            </div>
            <button type="button" class="join_queue">Join Queue</button>

            
        </form>
        
    </section>
    
    
    <footer class="footer_items">
        <a href="home.html">
            <div>
                <img src="../images/app-images/home.png" alt="home">
                <label for="home">Home</label>
            </div>
        </a>
        
        <a href="#">
            <div>
                <img src="../images/app-images/join_queue.png" alt="My number">
                <label for="home">My Number</label>
            </div>
        </a>
        <a href="service_choice.html">
            <div>
                <img src="../images/app-images/services.png" alt="Services">
                <label for="home">Services</label>
            </div>
        </a>
        
        <a href="#">
            <div>
                <img src="../images/app-images/user_profile.png" alt="Profile">
                <label for="home">Profile</label>
            </div>

        </a>
    </footer>

</body>
</html>
