<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>signup</title>
    <link rel="stylesheet" href="../CSS/signup.css">
</head>
<body>
    <main>
        <h1>CREATE AN ACCOUNT</h1>
        <p>Join SmartQueue and enjoy faster service!</p>
    </main>

    <section>
        <form action="#" method="post">
            <input type="text" name="username" id="username" placeholder="Full name" required> <br>
            <input type="tel" name="phonenumber" id="phonenumber" placeholder="Phone Number" required> <br>
            <input type="email" name="email" id="email" placeholder="Email (Optional)" > <br>
            <input type="password" name="password" id="password" placeholder="Password" required> <br>
            <input type="password" name="confirmPassword" id="confirmPassword" placeholder="Confirm Password" required> <br>
            <button type="submit">Sign Up</button>
        </form>

    </section>
    <section>
        <p>Already have an account? <br> <a href="#">Login</a></p>
    </section>

</body>
</html>
